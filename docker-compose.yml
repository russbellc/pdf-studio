version: '3.8'

services:
  pdf-worker:
    build:
      context: ./pdf-worker
      dockerfile: Dockerfile
    container_name: pdf_studio_worker
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdf_studio_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - pdf-worker
